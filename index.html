<!DOCTYPE html>
<html>
<head>
    <title>Judge, Jury, and Executioner: Phoenix</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #111; color: white; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        #game-ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            pointer-events: none; text-shadow: 1px 1px 4px #000;
        }
        canvas { display: block; margin: 0 auto; }
        .stat { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        #controls { font-size: 13px; color: #aaa; margin-top: 8px; }
        #overlay {
            position: absolute; width: 100%; text-align: center;
            top: 35%; display: none; pointer-events: none;
        }
        #overlay .title { color: #ff2222; font-size: 52px; font-weight: bold; text-shadow: 0 0 20px #ff0000; }
        #overlay .sub { font-size: 20px; color: #ccc; margin-top: 10px; }
        #overlay .restart { font-size: 18px; color: #ffff00; margin-top: 18px; animation: blink 1s step-start infinite; }
        #multiplier-flash {
            position: absolute; font-size: 28px; font-weight: bold;
            color: #ffff00; text-shadow: 0 0 8px #ff8800;
            pointer-events: none; display: none; z-index: 20;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="game-ui">
    <div class="stat">PHOENIX PD — UNIT 902</div>
    <div class="stat" style="color:#00ff88;">CREDITS: $<span id="credits">0</span></div>
    <div class="stat" style="color:#ff4444;">IA STRIKES: <span id="strikes">0</span> / 5</div>
    <div class="stat" style="color:#ffaa00; font-size:16px;">LEVEL: <span id="level">1</span></div>
    <div id="controls">ARROWS: Drive &nbsp;|&nbsp; SPACE: Shoot</div>
</div>

<div id="overlay">
    <div class="title">TERMINATED</div>
    <div class="sub">The city has revoked your badge.</div>
    <div class="sub" style="margin-top:6px;">Final Score: $<span id="final-score">0</span></div>
    <div class="restart">Press SPACE or ENTER to try again</div>
</div>

<div id="multiplier-flash"></div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const strikeEl = document.getElementById('strikes');
const creditEl = document.getElementById('credits');
const levelEl  = document.getElementById('level');
const overlay  = document.getElementById('overlay');
const finalScore = document.getElementById('final-score');
const mFlash   = document.getElementById('multiplier-flash');

canvas.width  = 800;
canvas.height = window.innerHeight;

// ── State ────────────────────────────────────────────────────────────────────
let credits, strikes, gameOver, level, frameCount;
let entities, bullets, keys, particles;
let shootCooldown, roadOffset, mFlashTimer;

function resetGame() {
    credits      = 0;
    strikes      = 0;
    gameOver     = false;
    level        = 1;
    frameCount   = 0;
    entities     = [];
    bullets      = [];
    particles    = [];
    keys         = {};
    shootCooldown = 0;
    roadOffset   = 0;
    mFlashTimer  = 0;

    player.x = canvas.width / 2 - player.w / 2;
    player.y = canvas.height - 150;

    overlay.style.display = 'none';
    creditEl.innerText = '0';
    strikeEl.innerText = '0';
    levelEl.innerText  = '1';
}

// ── Player ───────────────────────────────────────────────────────────────────
const player = {
    x: 0, y: 0,
    w: 36, h: 64,
    speed: 7,
    color: '#1155dd',
    lightFlicker: 0
};

// ── Input ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameOver && (e.code === 'Space' || e.code === 'Enter')) {
        resetGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ── Spawn ────────────────────────────────────────────────────────────────────
function spawnNPC() {
    if (gameOver) return;
    const isCriminal = Math.random() < 0.35 + level * 0.03;
    const speed = isCriminal
        ? 3 + level * 1.2 + Math.random() * 2
        : 2 + Math.random() * 2;
    entities.push({
        x: 30 + Math.random() * (canvas.width - 100),
        y: -80,
        w: 36, h: 64,
        speed,
        drift: (Math.random() - 0.5) * 0.6,   // slight lateral wander
        type: isCriminal ? 'criminal' : 'civilian',
        color: isCriminal ? '#cc2200' : '#eeeeee',
        flash: 0
    });
}

let spawnInterval = 1000;
let spawnTimer = setInterval(spawnNPC, spawnInterval);

// ── Particles ────────────────────────────────────────────────────────────────
function burst(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color
        });
    }
}

function showMultiplierFlash(text, x, y) {
    mFlash.innerText = text;
    mFlash.style.left = (canvas.offsetLeft + x - 20) + 'px';
    mFlash.style.top  = y + 'px';
    mFlash.style.display = 'block';
    mFlashTimer = 60;
}

// ── Drawing helpers ───────────────────────────────────────────────────────────
function drawCar(x, y, w, h, bodyColor, isPlayer) {
    const r = 4;

    // Body
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.roundRect(x, y + h * 0.15, w, h * 0.7, r);
    ctx.fill();

    // Roof cabin
    ctx.fillStyle = isPlayer ? '#003399' : (bodyColor === '#eeeeee' ? '#cccccc' : '#991100');
    ctx.beginPath();
    ctx.roundRect(x + w * 0.1, y + h * 0.05, w * 0.8, h * 0.45, r);
    ctx.fill();

    // Windshield
    ctx.fillStyle = 'rgba(180,220,255,0.6)';
    const wsY = isPlayer ? y + h * 0.1 : y + h * 0.35;
    ctx.fillRect(x + w * 0.15, wsY, w * 0.7, h * 0.2);

    // Wheels
    ctx.fillStyle = '#111';
    const wr = w * 0.18, wh = h * 0.14;
    ctx.fillRect(x - wr * 0.4, y + h * 0.18, wr, wh);
    ctx.fillRect(x + w - wr * 0.6, y + h * 0.18, wr, wh);
    ctx.fillRect(x - wr * 0.4, y + h * 0.68, wr, wh);
    ctx.fillRect(x + w - wr * 0.6, y + h * 0.68, wr, wh);

    if (isPlayer) {
        // Light bar (alternating red/blue each frame)
        const tick = Math.floor(Date.now() / 150) % 2;
        ctx.fillStyle = tick ? '#ff2222' : '#ff6666';
        ctx.fillRect(x + 2, y + h * 0.15, w * 0.45, 5);
        ctx.fillStyle = tick ? '#4466ff' : '#2244cc';
        ctx.fillRect(x + w * 0.5, y + h * 0.15, w * 0.45, 5);
    }
}

function drawRoad() {
    // Asphalt
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Shoulders
    ctx.fillStyle = '#444';
    ctx.fillRect(0, 0, 18, canvas.height);
    ctx.fillRect(canvas.width - 18, 0, 18, canvas.height);

    // Dashed centre line
    ctx.strokeStyle = '#ffee00';
    ctx.lineWidth = 3;
    ctx.setLineDash([28, 22]);
    ctx.lineDashOffset = -roadOffset;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    // Lane dividers (faint)
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    [canvas.width * 0.25, canvas.width * 0.75].forEach(lx => {
        ctx.setLineDash([16, 34]);
        ctx.lineDashOffset = -roadOffset;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);
    });
}

// ── Update ────────────────────────────────────────────────────────────────────
function update() {
    if (gameOver) return;

    frameCount++;
    roadOffset = (roadOffset + 6) % 50;

    // Level up every 30 s (1800 frames at ~60 fps)
    const newLevel = 1 + Math.floor(frameCount / 1800);
    if (newLevel !== level) {
        level = newLevel;
        levelEl.innerText = level;
        // Speed up spawning (min 400 ms)
        clearInterval(spawnTimer);
        spawnInterval = Math.max(400, 1000 - (level - 1) * 80);
        spawnTimer = setInterval(spawnNPC, spawnInterval);
    }

    // Player movement
    if (keys['ArrowLeft']  && player.x > 18)                       player.x -= player.speed;
    if (keys['ArrowRight'] && player.x < canvas.width - player.w - 18) player.x += player.speed;
    if (keys['ArrowUp']    && player.y > 0)                        player.y -= player.speed;
    if (keys['ArrowDown']  && player.y < canvas.height - player.h) player.y += player.speed;

    // Shoot
    if (shootCooldown > 0) shootCooldown--;
    if (keys['Space'] && shootCooldown === 0 && bullets.length < 6) {
        bullets.push({
            x: player.x + player.w / 2 - 2,
            y: player.y,
            w: 4, h: 12,
            flash: 4   // muzzle flash frames
        });
        shootCooldown = 12;
    }

    // Entities
    entities = entities.filter((npc, nIdx) => {
        npc.y += npc.speed;
        npc.x += npc.drift;
        // Keep within road
        npc.x = Math.max(18, Math.min(canvas.width - npc.w - 18, npc.x));
        if (npc.flash > 0) npc.flash--;

        // Hit player
        if (rectIntersect(player, npc)) {
            if (npc.type === 'criminal') {
                credits += 250 * level;
                creditEl.innerText = credits;
                burst(npc.x + npc.w / 2, npc.y + npc.h / 2, '#ff8800', 12);
                showMultiplierFlash(`+$${250 * level}`, npc.x, npc.y);
            } else {
                strikes++;
                strikeEl.innerText = strikes;
                burst(npc.x + npc.w / 2, npc.y + npc.h / 2, '#ffffff', 8);
            }
            return false;
        }
        return npc.y <= canvas.height;
    });

    // Bullets
    bullets = bullets.filter(b => {
        b.y -= 16;
        if (b.flash > 0) b.flash--;

        let hit = false;
        entities = entities.filter(npc => {
            if (hit) return true;
            if (rectIntersect(b, npc)) {
                hit = true;
                if (npc.type === 'civilian') {
                    strikes++;
                    strikeEl.innerText = strikes;
                    burst(npc.x + npc.w / 2, npc.y + npc.h / 2, '#ffffff', 10);
                } else {
                    const reward = 500 * level;
                    credits += reward;
                    creditEl.innerText = credits;
                    burst(npc.x + npc.w / 2, npc.y + npc.h / 2, '#ff4400', 14);
                    showMultiplierFlash(`+$${reward}`, npc.x, npc.y);
                }
                return false;
            }
            return true;
        });
        return !hit && b.y > -20;
    });

    // Particles
    particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.life -= 0.04;
        return p.life > 0;
    });

    // Multiplier flash timeout
    if (mFlashTimer > 0) {
        mFlashTimer--;
        if (mFlashTimer === 0) mFlash.style.display = 'none';
    }

    // Game over
    if (strikes >= 5) {
        gameOver = true;
        finalScore.innerText = credits;
        overlay.style.display = 'block';
    }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
    drawRoad();

    // Entities
    entities.forEach(npc => {
        if (npc.flash > 0) {
            ctx.save();
            ctx.globalAlpha = 0.5 + npc.flash * 0.1;
        }
        drawCar(npc.x, npc.y, npc.w, npc.h, npc.color, false);
        if (npc.flash > 0) ctx.restore();
    });

    // Player
    drawCar(player.x, player.y, player.w, player.h, player.color, true);

    // Muzzle flash
    bullets.forEach(b => {
        if (b.flash > 0) {
            ctx.save();
            ctx.globalAlpha = b.flash / 4;
            ctx.fillStyle = '#ffff88';
            ctx.beginPath();
            ctx.arc(b.x + 2, b.y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        ctx.fillStyle = '#ffff44';
        ctx.fillRect(b.x, b.y, b.w, b.h);
    });

    // Particles
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        ctx.restore();
    });

    requestAnimationFrame(() => { update(); draw(); });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
function rectIntersect(r1, r2) {
    return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x ||
             r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
}

resetGame();
draw();
</script>
</body>
</html>
